                  <p class="kv-modal-under">10 filer · docx, eml, jpg, md, pdf, pptx, xlsx</p>
                  <div class="kv-maate">
                    <p class="på"><i></i><span><b>Med skanning</b>Klart leser filene og merker det den finner. Du går gjennom og bestemmer.</span></p>
                    <p><i></i><span><b>Uten skanning</b>Ingenting merkes på forhånd. Du klikker på det som skal skjules.</span></p>
                  </div>
                  <p class="kv-sammen"><span><small>Skanningen ser etter og skjuler</small>Navn, Fødselsnummer, Telefon og e-post, Sensitiv, Bilskilt, Konto, Ansikter og 5 til</span><em>Endre</em></p>
                  <p class="kv-modal-bunn">
                    <span class="kv-btn hvit stor">Avbryt</span>
                    <span class="kv-btn stor" data-kv="skann">Skann <kbd>↵</kbd></span>
                  </p>
                </div>
              </div>

              <!-- «Før kopiene lages»: formen kopiene får -->
              <div class="kv-slor kv-s-kopivalg">
                <div class="kv-modal kv-kopivalg">
                  <h4>Før kopiene lages</h4>
                  <p class="kv-modal-under">10 filer · kopiene legges i kundesaker-klar</p>
                  <div class="kv-maate kv-former" data-kv="former">
                    <p class="på" data-form="kort"><i></i><span><b>Kort kode og kodeliste</b>Lett å lese. Kan føres tilbake med kontorets nøkkel.<code>[Person 4814887] + liste</code></span></p>
                    <p data-form="full"><i></i><span><b>Full kode i teksten</b>Ingen liste. Kan føres tilbake, men er tungt å lese.</span></p>
                    <p data-form="lapp"><i></i><span><b>Bare merkelapper</b>Lett å lese, men kan ikke føres tilbake.</span></p>
                    <p data-form="svart"><i></i><span><b>Svart sladd (PDF)</b>Det som sto der, er borte for godt.<code class="kv-svartprove"></code></span></p>
                  </div>
                  <p class="kv-modal-bunn">
                    <span class="kv-btn hvit stor">Avbryt</span>
                    <span class="kv-btn stor" data-kv="lagnaa">Lag 10 kopier <kbd>↵</kbd></span>
                  </p>
                </div>
              </div>

              <!-- Kopiene er laget -->
              <div class="kv-slor kv-s-ferdig">
                <div class="kv-ferdig">
                  <p class="kv-stor">Klart.</p>
                  <p>10 kopier er laget. Originalene ligger urørt. Les gjennom før du deler dem.</p>
                  <p class="kv-sti"><span>Dokumenter/</span>kundesaker-klar/</p>
                  <p class="kv-liten">Kodelisten ligger bakerst i hver kopi.</p>
                  <p class="kv-modal-bunn">
                    <span class="kv-btn hvit">Tilbake til mappen</span>
                    <span class="kv-btn">Åpne kopiene</span>
                  </p>
                </div>
              </div>
            </div>
          </div>
          </div>
          <span class="kv-peker" aria-hidden="true"></span>
          <!-- Kapitlene: hopper i avspillingen. Det som spilles nå, er markert. -->
          <ol class="kv-kapitler" data-kv="kapitler" aria-label="Kapitler i forhåndsvisningen">
            <li><button type="button" data-kapittel="0">Rens en mappe</button></li>
            <li><button type="button" data-kapittel="1">Gå gjennom</button></li>
            <li><button type="button" data-kapittel="2">Kopiene</button></li>
            <li><button type="button" data-kapittel="3">Høyreklikk i Finder</button></li>
            <li><button type="button" data-kapittel="4">Rens og tilbakefør tekst</button></li>
          </ol>
          <!-- Lesingen spilles av mye raskere enn den går på en vanlig maskin. Det skal stå. -->
          <p class="kv-spol" aria-hidden="true">
            <svg viewBox="0 0 20 12"><path d="M1 1l8 5-8 5zM10 1l8 5-8 5z" /></svg>
            <span>Spolt fram. Hvor lang tid lesingen tar, varierer fra maskin til maskin. På en vanlig bærbar går det tregere.</span>
          </p>
          <figcaption class="skjult-tekst">
            Slik virker Klart. Velg en mappe, og Klart leser filene, også PDF, e-post, regneark,
            PowerPoint og bilder, og merker navn, fødselsnumre, kontaktinfo, adresser, kontonumre,
            sensitive opplysninger, bilskilt og ansikter, som pikseleres. Det Klart er usikker på,
            går du gjennom og bestemmer selv: skjul eller la stå. Kopiene kan få korte koder med
            kodeliste, fulle koder, bare merkelapper eller svart sladd, og originalene ligger urørt.
            I Finder kan en mappe renses med høyreklikk › Hurtighandlinger › Rens med Klart.
            Tekst med koder kan gis til et KI-verktøy, og svaret tilbakeføres i Klart, så navnene
            kommer tilbake uten at KI-en har sett dem. Lesingen er spolt fram: hvor lang tid den
            tar, varierer fra maskin til maskin.
          </figcaption>
        </figure>
