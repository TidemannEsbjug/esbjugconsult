<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Klart</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a52be" />
    <!--
      Siden på /klart til Klart åpner for alle (LANSERING i .worker/klart.js, 11.11.2026 kl. 23.11).
      Vinterbildet, snø som faller, merket og nedtellingen i det havblå glasskortet fra heroen.
      Innloggingen er skjult (eieren 11.11.2026): klikk på merket, skriv passordet og trykk Enter
      (test.js). Riktig passord gir kapselen som viser de ekte sidene (handleTest i klart.js).
      Passordet er hemmeligheten KLART_TESTPASSORD, ikke noe i repoet.
    -->
    <link rel="icon" type="image/png" href="/klart/favicon.png" />
    <link rel="stylesheet" href="/klart/fonts.css" />
    <link rel="stylesheet" href="/klart/test.css" />
    <script src="/klart/test.js" defer></script>
  </head>
  <body>
    <main class="inngang">
      <img class="bilde" src="/klart/assets/hero-vinter.jpg" width="2400" height="1600" alt="" aria-hidden="true" />
      <canvas class="sno" aria-hidden="true"></canvas>
      <div class="innhold">
        <h1 class="merke" data-merke>
          <img class="ikon" src="/klart/assets/klart-ikon.png" width="256" height="256" alt="" aria-hidden="true" />
          <span>Klart</span>
        </h1>
        <!-- Samme tidspunkt som LANSERING i .worker/klart.js (23.11 norsk tid 11.11.2026). -->
        <div class="kort nedtelling" data-til="2026-11-11T22:11:00Z">
          <p class="nedtelling-tekst">Åpner i kveld kl. 11:11</p>
          <div class="nedtelling-ruter" role="timer" aria-live="off">
            <p class="rute"><b data-del="t">--</b><span>timer</span></p>
            <p class="skille" aria-hidden="true">:</p>
            <p class="rute"><b data-del="m">--</b><span>minutter</span></p>
            <p class="skille" aria-hidden="true">:</p>
            <p class="rute"><b data-del="s">--</b><span>sekunder</span></p>
          </div>
        </div>
      </div>
      <form class="skjult" method="post" action="/klart/test" hidden>
        <input type="hidden" name="passord" />
      </form>
    </main>
  </body>
</html>
