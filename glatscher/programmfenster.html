              <div class="kv-scene kv-s-ki kv-skrivebord">
                <div class="kv-ki">
                  <div class="kv-vindulinje"><span class="kv-lys"><i></i><i></i><i></i></span><b>KI-Assistent</b></div>
                  <div class="kv-ki-samtale">
                    <div class="kv-ki-bruker" data-kv="kibruker">
                      <p>Schreibe eine kurze Antwort auf diese Nachricht:</p>
                      <p class="kv-ki-sitat">Hallo! Können Sie heute <code>[Person 6311794]</code> unter <code>[Telefon 6289990]</code> anrufen? Sie ist in die <code>[Adresse 8950779]</code> umgezogen, und ihr Gehalt soll jetzt auf das Konto <code>[Kontonummer 7719741]</code> gehen.</p>
                    </div>
                    <div class="kv-ki-svar" data-kv="kisvar"><p data-kv="kisvartekst"></p><span class="kv-ki-kopier" data-kv="kikopier">Antwort kopieren</span></div>
                  </div>
                  <div class="kv-ki-felt" data-kv="kifelt"><span>Nachricht schreiben …</span><i>↑</i></div>
                </div>
                <p class="kv-ki-merke">Die KI erhält nur die Codes. Name, Telefon, Adresse und Konto bleiben auf dem Rechner.</p>
              </div>

              <!-- «Før skanningen»: over startskjermen, når mappen er valgt -->
              <div class="kv-slor kv-s-forvalg">
                <div class="kv-modal">
                  <h4>Mandantenakten</h4>
                  <p class="kv-modal-under">10 Dateien · docx, eml, jpg, md, pdf, pptx, xlsx</p>
                  <div class="kv-maate">
                    <p class="på"><i></i><span><b>Mit Scan</b>Glatscher liest die Dateien und markiert, was es findet. Sie gehen alles durch und entscheiden.</span></p>
                    <p><i></i><span><b>Ohne Scan</b>Nichts wird vorab markiert. Sie klicken an, was ausgeblendet werden soll.</span></p>
                  </div>
                  <p class="kv-sammen"><span><small>Der Scan sucht und blendet aus</small>Namen, AHV-Nummer und Ausweise, Telefon und E-Mail, Sensibel, Kennzeichen, Konto, Gesichter und 5 weitere</span><em>Ändern</em></p>
                  <p class="kv-modal-bunn">
                    <span class="kv-btn hvit stor">Abbrechen</span>
                    <span class="kv-btn stor" data-kv="skann">Scannen <kbd>↵</kbd></span>
                  </p>
                </div>
              </div>

              <!-- «Før kopiene lages»: formen kopiene får -->
              <div class="kv-slor kv-s-kopivalg">
                <div class="kv-modal kv-kopivalg">
                  <h4>Bevor die Kopien erstellt werden</h4>
                  <p class="kv-modal-under">10 Dateien · die Kopien kommen in Mandantenakten-klar</p>
                  <div class="kv-maate kv-former" data-kv="former">
                    <p class="på" data-form="kort"><i></i><span><b>Kurzer Code und Codeliste</b>Gut lesbar. Lässt sich mit dem Schlüssel Ihres Büros zurückführen.<code>[Person 4814887] + Liste</code></span></p>
                    <p data-form="full"><i></i><span><b>Voller Code im Text</b>Keine Liste. Lässt sich zurückführen, ist aber schwer zu lesen.</span></p>
                    <p data-form="lapp"><i></i><span><b>Nur Platzhalter</b>Gut lesbar, kann aber nicht zurückgeführt werden.</span></p>
                    <p data-form="svart"><i></i><span><b>Schwärzung (PDF)</b>Was dort stand, ist endgültig weg.<code class="kv-svartprove"></code></span></p>
                  </div>
                  <p class="kv-modal-bunn">
                    <span class="kv-btn hvit stor">Abbrechen</span>
                    <span class="kv-btn stor" data-kv="lagnaa">10 Kopien erstellen <kbd>↵</kbd></span>
                  </p>
                </div>
              </div>

              <!-- Kopiene er laget -->
              <div class="kv-slor kv-s-ferdig">
                <div class="kv-ferdig">
                  <p class="kv-stor">Alles klar.</p>
                  <p>10 Kopien wurden erstellt. Die Originale bleiben unberührt. Lesen Sie die Kopien durch, bevor Sie sie weitergeben.</p>
                  <p class="kv-sti"><span>Dokumente/</span>Mandantenakten-klar/</p>
                  <p class="kv-liten">Die Codeliste steht am Ende jeder Kopie.</p>
                  <p class="kv-modal-bunn">
                    <span class="kv-btn hvit">Zurück zum Ordner</span>
                    <span class="kv-btn">Kopien öffnen</span>
                  </p>
                </div>
              </div>
            </div>
          </div>
          </div>
          <span class="kv-peker" aria-hidden="true"></span>
          <!-- Kapitlene: hopper i avspillingen. Det som spilles nå, er markert. -->
          <ol class="kv-kapitler" data-kv="kapitler" aria-label="Kapitel der Vorschau">
            <li><button type="button" data-kapittel="0">Ordner bereinigen</button></li>
            <li><button type="button" data-kapittel="1">Durchgehen</button></li>
            <li><button type="button" data-kapittel="2">Die Kopien</button></li>
            <li><button type="button" data-kapittel="3">Rechtsklick im Finder</button></li>
            <li><button type="button" data-kapittel="4">Text bereinigen und zurückführen</button></li>
          </ol>
          <!-- Lesingen spilles av mye raskere enn den går på en vanlig maskin. Det skal stå. -->
          <p class="kv-spol" aria-hidden="true">
            <svg viewBox="0 0 20 12"><path d="M1 1l8 5-8 5zM10 1l8 5-8 5z" /></svg>
            <span>Vorgespult. Wie lange das Lesen dauert, ist von Rechner zu Rechner verschieden. Auf einem gewöhnlichen Laptop geht es langsamer.</span>
          </p>
          <figcaption class="skjult-tekst">
            So arbeitet Glatscher. Wählen Sie einen Ordner, und Glatscher liest die Dateien, auch PDF,
            E-Mail, Tabellen, PowerPoint und Bilder, und markiert Namen, AHV-Nummern, Kontaktdaten,
            Adressen, Kontonummern, sensible Angaben, Kennzeichen und Gesichter, die verpixelt werden.
            Wobei Glatscher unsicher ist, gehen Sie selbst durch und entscheiden: ausblenden oder
            stehen lassen. Die Kopien können kurze Codes mit Codeliste, volle Codes, nur Platzhalter
            oder eine Schwärzung bekommen, und die Originale bleiben unberührt. Im Finder lässt sich
            ein Ordner mit Rechtsklick › Schnellaktionen › Mit Glatscher bereinigen bereinigen. Text
            mit Codes kann an ein KI-Werkzeug gegeben werden, und die Antwort wird in Glatscher
            zurückgeführt, sodass die Namen zurückkommen, ohne dass die KI sie gesehen hat. Das Lesen
            ist vorgespult: Wie lange es dauert, ist von Rechner zu Rechner verschieden.
          </figcaption>
        </figure>
