              <!-- Skrivebordet: et KI-verktøy som bare får kodene -->
              <div class="kv-scene kv-s-ki kv-skrivebord">
                <div class="kv-ki">
                  <div class="kv-vindulinje"><span class="kv-lys"><i></i><i></i><i></i></span><b>Assistente IA</b></div>
                  <div class="kv-ki-samtale">
                    <div class="kv-ki-bruker" data-kv="kibruker">
                      <p>Scrivi una breve risposta a questo messaggio:</p>
                      <p class="kv-ki-sitat">Buongiorno! Può chiamare oggi <code>[Nome 6311794]</code> al numero <code>[Telefono 6289990]</code>? Si è trasferita in <code>[Indirizzo 8950779]</code> e da ora lo stipendio va accreditato sul conto <code>[IBAN 7719741]</code>.</p>
                    </div>
                    <div class="kv-ki-svar" data-kv="kisvar"><p data-kv="kisvartekst"></p><span class="kv-ki-kopier" data-kv="kikopier">Copia la risposta</span></div>
                  </div>
                  <div class="kv-ki-felt" data-kv="kifelt"><span>Scrivi un messaggio…</span><i>↑</i></div>
                </div>
                <p class="kv-ki-merke">L'IA riceve solo i codici. Nome, telefono, indirizzo e conto restano sul computer.</p>
              </div>

              <!-- «Før skanningen»: over startskjermen, når mappen er valgt -->
              <div class="kv-slor kv-s-forvalg">
                <div class="kv-modal">
                  <h4>Pratiche clienti</h4>
                  <p class="kv-modal-under">10 file · docx, eml, jpg, md, pdf, pptx, xlsx</p>
                  <div class="kv-maate">
                    <p class="på"><i></i><span><b>Con analisi</b>Glatscher legge i file e contrassegna ciò che trova. Lei verifica tutto e decide.</span></p>
                    <p><i></i><span><b>Senza analisi</b>Nulla viene contrassegnato in anticipo. Lei fa clic su ciò che va oscurato.</span></p>
                  </div>
                  <p class="kv-sammen"><span><small>L'analisi cerca e oscura</small>Nomi, AVS e documenti, telefono ed e-mail, categorie particolari, targhe, conti, volti e altri 5</span><em>Modifica</em></p>
                  <p class="kv-modal-bunn">
                    <span class="kv-btn hvit stor">Annulla</span>
                    <span class="kv-btn stor" data-kv="skann">Analizza <kbd>↵</kbd></span>
                  </p>
                </div>
              </div>

              <!-- «Før kopiene lages»: formen kopiene får -->
              <div class="kv-slor kv-s-kopivalg">
                <div class="kv-modal kv-kopivalg">
                  <h4>Prima di creare le copie</h4>
                  <p class="kv-modal-under">10 file · le copie vanno in Pratiche clienti-chiaro</p>
                  <div class="kv-maate kv-former" data-kv="former">
                    <p class="på" data-form="kort"><i></i><span><b>Codice breve ed elenco dei codici</b>Facile da leggere. Si può ripristinare con la chiave del Suo ufficio.<code>[Nome 4814887] + elenco</code></span></p>
                    <p data-form="full"><i></i><span><b>Codice completo nel testo</b>Senza elenco. Si può ripristinare, ma è difficile da leggere.</span></p>
                    <p data-form="lapp"><i></i><span><b>Solo etichette</b>Facile da leggere, ma l'originale non si può ripristinare.</span></p>
                    <p data-form="svart"><i></i><span><b>Riquadri neri (PDF)</b>Ciò che c'era sotto scompare per sempre.<code class="kv-svartprove"></code></span></p>
                  </div>
                  <p class="kv-modal-bunn">
                    <span class="kv-btn hvit stor">Annulla</span>
                    <span class="kv-btn stor" data-kv="lagnaa">Crea 10 copie <kbd>↵</kbd></span>
                  </p>
                </div>
              </div>

              <!-- Kopiene er laget -->
              <div class="kv-slor kv-s-ferdig">
                <div class="kv-ferdig">
                  <p class="kv-stor">Fatto.</p>
                  <p>10 copie sono state create. Gli originali non sono stati toccati. Legga le copie prima di condividerle.</p>
                  <p class="kv-sti"><span>Documenti/</span>Pratiche clienti-chiaro/</p>
                  <p class="kv-liten">L'elenco dei codici è alla fine di ogni copia.</p>
                  <p class="kv-modal-bunn">
                    <span class="kv-btn hvit">Torna alla cartella</span>
                    <span class="kv-btn">Apri le copie</span>
                  </p>
                </div>
              </div>

            <svg viewBox="0 0 20 12"><path d="M1 1l8 5-8 5zM10 1l8 5-8 5z" /></svg>
            <span>Accelerato. Il tempo di lettura varia da computer a computer. Su un normale portatile è più lento.</span>

          <figcaption class="skjult-tekst">
            Così funziona Glatscher. Lei sceglie una cartella e Glatscher legge i file, anche PDF, e-mail,
            fogli di calcolo, PowerPoint e immagini, e contrassegna nomi, numeri AVS, dati di contatto,
            indirizzi, IBAN e numeri di conto, dati particolari, targhe e volti, che vengono pixelati.
            Ciò su cui Glatscher non è sicuro lo verifica Lei e decide: oscurare o lasciare visibile.
            Le copie possono avere codici brevi con elenco dei codici, codici completi, solo etichette o
            riquadri neri, e gli originali non vengono toccati. Nel Finder una cartella si oscura con clic
            destro › Azioni rapide › Oscura con Glatscher. Un testo con i codici può essere dato a uno
            strumento di IA, e la risposta viene ripristinata in Glatscher, così i nomi tornano senza che
            l'IA li abbia visti. La lettura è accelerata: il tempo che richiede varia da computer a computer.
          </figcaption>
