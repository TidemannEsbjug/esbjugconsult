                  <div class="kv-ki-felt" data-kv="kifelt"><span>Escreve uma mensagem…</span><i>↑</i></div>
                </div>
                <p class="kv-ki-merke">A IA só recebe os códigos. O nome, o telefone, a morada e a conta ficam no computador.</p>
              </div>

              <!-- «Før skanningen»: over startskjermen, når mappen er valgt -->
              <div class="kv-slor kv-s-forvalg">
                <div class="kv-modal">
                  <h4>Processos</h4>
                  <p class="kv-modal-under">10 ficheiros · docx, eml, jpg, md, pdf, pptx, xlsx</p>
                  <div class="kv-maate">
                    <p class="på"><i></i><span><b>Com análise</b>O Claríssimo lê os ficheiros e marca o que encontra. O utilizador revê tudo e decide.</span></p>
                    <p><i></i><span><b>Sem análise</b>Nada é marcado de antemão. O utilizador clica no que quer ocultar.</span></p>
                  </div>
                  <p class="kv-sammen"><span><small>A análise procura e oculta</small>Nomes, números de identificação, telefone e e-mail, sensível, matrículas, contas, rostos e mais 5</span><em>Alterar</em></p>
                  <p class="kv-modal-bunn">
                    <span class="kv-btn hvit stor">Cancelar</span>
                    <span class="kv-btn stor" data-kv="skann">Analisar <kbd>↵</kbd></span>
                  </p>
                </div>
              </div>

              <!-- «Før kopiene lages»: formen kopiene får -->
              <div class="kv-slor kv-s-kopivalg">
                <div class="kv-modal kv-kopivalg">
                  <h4>Antes de criar as cópias</h4>
                  <p class="kv-modal-under">10 ficheiros · as cópias vão para Processos-limpo</p>
                  <div class="kv-maate kv-former" data-kv="former">
                    <p class="på" data-form="kort"><i></i><span><b>Código curto e lista de códigos</b>Fácil de ler. Pode ser restaurada com a chave do seu escritório.<code>[Pessoa 4814887] + lista</code></span></p>
                    <p data-form="full"><i></i><span><b>Código completo no texto</b>Sem lista. Pode ser restaurada, mas custa a ler.</span></p>
                    <p data-form="lapp"><i></i><span><b>Só etiquetas</b>Fácil de ler, mas não pode ser restaurada.</span></p>
                    <p data-form="svart"><i></i><span><b>Riscado a preto (PDF)</b>O que lá estava desaparece para sempre.<code class="kv-svartprove"></code></span></p>
                  </div>
                  <p class="kv-modal-bunn">
                    <span class="kv-btn hvit stor">Cancelar</span>
                    <span class="kv-btn stor" data-kv="lagnaa">Criar 10 cópias <kbd>↵</kbd></span>
                  </p>
                </div>
              </div>

              <!-- Kopiene er laget -->
              <div class="kv-slor kv-s-ferdig">
                <div class="kv-ferdig">
                  <p class="kv-stor">Concluído.</p>
                  <p>Foram criadas 10 cópias. Os originais não foram alterados. Leia as cópias antes de as partilhar.</p>
                  <p class="kv-sti"><span>Documentos/</span>Processos-limpo/</p>
                  <p class="kv-liten">A lista de códigos está no fim de cada cópia.</p>
                  <p class="kv-modal-bunn">
                    <span class="kv-btn hvit">Voltar à pasta</span>
                    <span class="kv-btn">Abrir as cópias</span>
                  </p>
                </div>
              </div>
            </div>
          </div>
          </div>
          <span class="kv-peker" aria-hidden="true"></span>
          <!-- Kapitlene: hopper i avspillingen. Det som spilles nå, er markert. -->
          <ol class="kv-kapitler" data-kv="kapitler" aria-label="Capítulos da demonstração">
            <li><button type="button" data-kapittel="0">Ocultar uma pasta</button></li>
            <li><button type="button" data-kapittel="1">Rever</button></li>
            <li><button type="button" data-kapittel="2">As cópias</button></li>
            <li><button type="button" data-kapittel="3">Clique direito no Finder</button></li>
            <li><button type="button" data-kapittel="4">Ocultar e restaurar texto</button></li>
          </ol>
          <!-- Lesingen spilles av mye raskere enn den går på en vanlig maskin. Det skal stå. -->
          <p class="kv-spol" aria-hidden="true">
            <svg viewBox="0 0 20 12"><path d="M1 1l8 5-8 5zM10 1l8 5-8 5z" /></svg>
            <span>Acelerado. O tempo de leitura varia de computador para computador. Num portátil comum é mais lento.</span>
          </p>
          <figcaption class="skjult-tekst">
            Assim trabalha o Claríssimo. Escolha uma pasta e o Claríssimo lê os ficheiros, também PDF,
            e-mail, folhas de cálculo, PowerPoint e imagens, e marca nomes, números de NIF, contactos,
            moradas, números de conta, dados sensíveis, matrículas e rostos, que são pixelizados.
            Onde o Claríssimo tem dúvidas, o utilizador revê e decide: ocultar ou
            deixar. As cópias podem ter códigos curtos com lista de códigos, códigos completos, só etiquetas
            ou riscado a preto, e os originais não são alterados. No Finder, pode ocultar
            uma pasta com o botão direito › Ações rápidas › Ocultar com o Claríssimo. Um texto
            com códigos pode ser dado a uma ferramenta de IA, e a resposta é restaurada no Claríssimo,
            de modo que os nomes voltam sem que a IA os tenha visto. A leitura
            está acelerada: o tempo varia de computador para computador.
          </figcaption>
        </figure>
