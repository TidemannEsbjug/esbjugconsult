                  <p class="kv-sammen"><span><small>El análisis busca y oculta</small>Nombres, números de identidad, teléfono y correo, sensible, matrículas, cuentas, caras y 5 más</span><em>Cambiar</em></p>
                  <p class="kv-modal-bunn">

          <figcaption class="skjult-tekst">
            Así trabaja Clarísimo. Elija una carpeta y Clarísimo lee los archivos, también PDF,
            correo, hojas de cálculo, PowerPoint e imágenes, y marca nombres, números de DNI, datos de contacto,
            direcciones, números de cuenta, datos sensibles, matrículas y caras, que se pixelan.
            Donde Clarísimo tiene dudas, usted revisa y decide: ocultar o
            dejar. Las copias pueden llevar códigos cortos con lista de códigos, códigos completos, solo etiquetas
            o tachado en negro, y los originales no se tocan. En el Finder se puede ocultar
            una carpeta con clic derecho › Acciones rápidas › Ocultar con Clarísimo. Un texto
            con códigos se puede dar a una herramienta de IA, y la respuesta se restaura en Clarísimo,
            de modo que los nombres vuelven sin que la IA los haya visto. La lectura
            está acelerada: lo que tarda varía de un ordenador a otro.
