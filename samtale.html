<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Samtale</title></head>
<body>
<audio id="a" autoplay playsinline></audio>
<script>
// Eier-siden av lydsamtalen. Kjøres usynlig i Esbjug Chat-appen (WKWebView). Signaleringen går via appens
// chatforbindelse: ut med webkit.messageHandlers.rtc, inn med window.onSignal(). Status meldes til appen.
const ICE=[{urls:['stun:stun.cloudflare.com:3478','stun:stun.l.google.com:19302']}];
const post=(h,d)=>{try{webkit.messageHandlers[h].postMessage(d)}catch(e){}};
let pc=null,local=null;
async function start(){
  try{local=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){post('status','nomic');return}
  post('status','ringing');
}
async function call(){
  pc=new RTCPeerConnection({iceServers:ICE});
  local.getTracks().forEach(t=>pc.addTrack(t,local));
  pc.onicecandidate=e=>{if(e.candidate)post('rtc',{cand:e.candidate.toJSON()})};
  pc.ontrack=e=>{const a=document.getElementById('a');a.srcObject=e.streams[0];a.play().catch(()=>{})};
  pc.onconnectionstatechange=()=>{const s=pc&&pc.connectionState;if(s==='connected')post('status','connected');else if(s==='failed')post('status','failed')};
  post('status','connecting');
  await pc.setLocalDescription(await pc.createOffer());
  post('rtc',{sdp:pc.localDescription.toJSON()});
}
window.onSignal=async d=>{try{
  if(d.type==='ready')await call();
  else if(d.sdp&&pc)await pc.setRemoteDescription(d.sdp);
  else if(d.cand&&pc)await pc.addIceCandidate(d.cand);
  else if(d.type==='decline')post('status',d.reason==='mic'?'visitor-nomic':'declined');
  else if(d.type==='bye'){post('status','ended');hangup(false)}
}catch(e){post('status','error:'+e.message)}};
window.setMute=m=>{local&&local.getAudioTracks().forEach(t=>t.enabled=!m)};
window.hangup=(tell=true)=>{if(tell)post('rtc',{type:'bye'});if(pc){pc.close();pc=null}if(local){local.getTracks().forEach(t=>t.stop());local=null}};
start();
</script>
</body></html>
