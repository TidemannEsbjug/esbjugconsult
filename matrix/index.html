<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000a1f">
<title>Matrix · Esbjug Consult</title>
<style>
  @font-face{font-family:"Runer";src:url(/media/fonts/noto-sans-runic.woff2) format("woff2");unicode-range:U+16A0-16F8;font-display:block}
  html,body{margin:0;height:100%;background:#000a1f;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  body.stille{cursor:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="himmel"></canvas>
<canvas id="regn"></canvas>
<script>
// /matrix: skjermen mens maskinene jobber. Matrix-regnet i polarnatt: runer og ÆØÅ faller i søyler i to lag
// (fjernt og nært), og nordlyset beveger seg øverst. Ingen tekst på skjermen.
// Maskinene styrer regnet: hver søyle hører til én av Starbase, Starship og Falcon 9 (annenhver).
// «I bruk» gir tett, raskt regn; «På» rolig; «Av» ingenting.
// Av og til fanges regnet: der en strøm passerer en bestemt rad, blir tegnet stående som en bokstav, til et
// ord står i regnet: et selvhypnoseord fra lista ORD, og hver fjerde gang «Esbjug Consult». Litt etter tar de
// neste strømmene bokstavene med seg igjen. Siden står på pulten hele tiden.
// Klikk: fullskjerm og skjermen holdes våken.
const RUNER = 'ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟᚼᛅᛆᛋᛌᛐᛑᛘᛙᛦᛧᛨᛩᛪ';
const LATIN = 'ÆØÅæøå0123456789';
const tegn = () => Math.random() < .78 ? RUNER[Math.random() * RUNER.length | 0] : LATIN[Math.random() * LATIN.length | 0];
const MASKINER = ['starbase', 'starship', 'falcon'];
// Bokstavene i regnet og ordene: maskinens egen monospace, som i en terminal.
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace';
const lett = matchMedia('(prefers-reduced-motion: reduce)').matches;

const hc = document.getElementById('himmel'), h = hc.getContext('2d');
const rc = document.getElementById('regn'), r = rc.getContext('2d');
let W, H, dpr, fnugg = [];

// Tilstand per maskin: 'bruk' | 'paa' | 'av'. Før første svar regner det rolig, så siden aldri står tom.
const tilstand = { starbase: 'paa', starship: 'paa', falcon: 'paa' };
const FART = { bruk: 1, paa: .45, av: 0 };      // fallfart i forhold til full
const TETT = { bruk: .9, paa: .35, av: 0 };     // sjanse for at en ledig søyle starter en ny strøm

// To lag: det fjerne er mindre, mørkere og tregere, og gir dybde bak det nære.
const LAG = [
  { skala: .6, lys: .32, fart: .55, kol: [] },
  { skala: 1, lys: 1, fart: 1, kol: [], naer: true }
];
let fs;   // tegnstørrelsen i det nære laget

function stoerrelse() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [hc, rc]) { c.width = W * dpr; c.height = H * dpr; }
  h.setTransform(dpr, 0, 0, dpr, 0, 0); r.setTransform(dpr, 0, 0, dpr, 0, 0);
  fs = Math.round(Math.max(14, Math.min(22, W / 70)));
  for (const l of LAG) {
    l.fs = Math.round(fs * l.skala);
    const n = Math.ceil(W / l.fs), gml = l.kol;
    l.kol = Array.from({ length: n }, (_, i) => gml[i] || { i, m: MASKINER[i % 3], aktiv: false, spor: [] });
  }
  fnugg = Array.from({ length: Math.round(W * H / 14000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + .3, v: Math.random() * .3 + .12, f: Math.random() * 6 }));
  ord = null;
}

function start(l, k, dt, midt) {
  let st = tilstand[k.m];
  // Søyler som har en bokstav å fange eller slippe, regner alltid, ellers blir ordet aldri ferdig.
  const b = l.naer && ord && ord.bokst.find(b => b.c === k.i && (ord.fase === 'fanger' ? !b.fanget : ord.fase === 'slipper' && !b.borte));
  if (b) st = 'bruk';
  if (st === 'av' || (!midt && Math.random() > TETT[st] * .03 * dt)) return;
  k.aktiv = true; k.y = midt ? Math.random() * H * .8 : -l.fs * (Math.random() * 8);
  k.len = 8 + Math.random() * 22 | 0;
  k.v = (0.18 + Math.random() * .22) * FART[st] * l.fart * l.fs;
  k.spor = midt ? Array.from({ length: k.len }, (_, j) => ({ c: tegn(), y: (Math.floor(k.y / l.fs) - j) * l.fs })) : [];
  k.rod = l.naer && Math.random() < .05;        // av og til en strøm med rødt hode, flaggets rødt
}

// Ordet: en rad og én søyle per bokstav et sted i regnet. Fase «fanger»: hodet til en strøm som når ruta, blir
// stående som bokstaven. «Holder»: ordet står i regnet. «Slipper»: neste hode tar bokstaven med seg.
const ORD = ['USTOPPELIG', 'DYKTIG', 'ENERGISK', 'SMART', 'KLAR', 'FREMRAGENDE', 'VÅKEN', 'LANGSIKTIG',
  'FOKUSERT', 'ROLIG', 'STERK', 'MODIG', 'DISIPLINERT', 'UTHOLDENDE', 'SKARP', 'TRYGG', 'KREATIV', 'MÅLRETTET',
  'UREDD', 'SAMLET', 'PRESIS', 'STØDIG', 'TÅLMODIG', 'VILJESTERK', 'NYSGJERRIG', 'GRENSELØS', 'SULTEN',
  'KOMPROMISSLØS', 'BESLUTTSOM', 'HANDLEKRAFTIG', 'FRI', 'ROBUST', 'TILSTEDE', 'SKAPENDE', 'FRYKTLØS'];
let ord = null, nesteOrd = performance.now() + 9000, antallOrd = 0, pose = [];
// Ordene trekkes fra en stokket pose, så ingen kommer igjen før alle har vært der.
function velgOrd() {
  if (++antallOrd % 4 === 0) return 'Esbjug Consult';
  if (!pose.length) pose = ORD.slice().sort(() => Math.random() - .5);
  return pose.pop();
}
function nyttOrd(t) {
  const tekst = velgOrd(), n = LAG[1].kol.length, rader = Math.floor(H / fs);
  const c0 = n <= tekst.length + 4 ? Math.max(0, (n - tekst.length) >> 1) : 2 + Math.floor(Math.random() * (n - tekst.length - 4));
  const rad = Math.floor(rader * (.25 + Math.random() * .45));
  ord = { rad, fase: 'fanger', t, bokst: [...tekst].map((ch, i) => ({ ch, c: c0 + i })).filter(b => b.ch !== ' ') };
}
function ordSteg(t) {
  const o = ord;
  if (o.fase === 'fanger' && o.bokst.every(b => b.fanget)) { o.fase = 'holder'; o.t = t; }
  else if (o.fase === 'holder' && t - o.t > 7000) { o.fase = 'slipper'; o.t = t; }
  else if (o.fase === 'slipper' && (o.bokst.every(b => b.borte) || t - o.t > 15000)) { ord = null; nesteOrd = t + 15000 + Math.random() * 20000; }
}
const bokstavI = (c, rad) => ord && rad === ord.rad ? ord.bokst.find(b => b.c === c) : null;

// Nordlyset: tre bånd i isblått og hvitt med en rød kant, tegnet på eget lerret hver fjerde ramme.
function himmel(t) {
  const g = h.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#000816'); g.addColorStop(.55, '#001437'); g.addColorStop(1, '#00296f');
  h.fillStyle = g; h.fillRect(0, 0, W, H);
  h.globalCompositeOperation = 'lighter';
  const s = t / 1000;
  const baand = [
    { y: .16, a: .10, f: .0016, fart: .05, farge: '160,205,240', tykk: .22 },
    { y: .24, a: .07, f: .0024, fart: -.035, farge: '220,236,250', tykk: .14 },
    { y: .12, a: .045, f: .0011, fart: .025, farge: '186,12,47', tykk: .10 }
  ];
  for (const b of baand) {
    for (let x = -20; x < W + 20; x += 4) {
      const bolge = Math.sin(x * b.f + s * b.fart * 6) * 40 + Math.sin(x * b.f * 2.7 - s * b.fart * 9) * 18;
      const y = H * b.y + bolge;
      const lys = (Math.sin(x * .011 + s * .7) * .5 + .5) * .7 + .3;
      const hoy = H * b.tykk * (0.6 + .4 * Math.sin(x * .004 + s * .3));
      const lg = h.createLinearGradient(0, y - hoy, 0, y + 20);
      lg.addColorStop(0, `rgba(${b.farge},0)`);
      lg.addColorStop(.85, `rgba(${b.farge},${b.a * lys})`);
      lg.addColorStop(1, `rgba(${b.farge},0)`);
      h.fillStyle = lg; h.fillRect(x, y - hoy, 4, hoy + 20);
    }
  }
  h.globalCompositeOperation = 'source-over';
  // Stjerner som så vidt blinker.
  for (let i = 0; i < 70; i++) {
    const x = (i * 7919 % 1000) / 1000 * W, y = (i * 104729 % 1000) / 1000 * H * .55;
    h.fillStyle = `rgba(238,245,251,${.15 + .25 * (Math.sin(s * 1.3 + i) * .5 + .5)})`;
    h.fillRect(x, y, 1.2, 1.2);
  }
  // Mørkere kanter, så blikket havner i midten.
  const v = h.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .3, W / 2, H * .5, Math.max(W, H) * .8);
  v.addColorStop(0, 'rgba(0,6,20,0)'); v.addColorStop(1, 'rgba(0,6,20,.55)');
  h.fillStyle = v; h.fillRect(0, 0, W, H);
}

function regnLag(l, dt, t) {
  const f = l.fs;
  r.font = `${l.naer ? 500 : 400} ${f}px Runer, ${MONO}`;
  for (const k of l.kol) {
    if (!k.aktiv) { start(l, k, dt); continue; }
    const forY = k.y;
    k.y += k.v * (tilstand[k.m] === 'av' ? .6 : 1) * dt;   // en strøm som er i gang, faller ferdig selv om maskinen går av
    // Nytt tegn hver gang hodet passerer en rute.
    const rad = Math.floor(k.y / f);
    if (rad !== Math.floor(forY / f)) {
      k.spor.unshift({ c: tegn(), y: rad * f });
      if (k.spor.length > k.len) k.spor.pop();
      const b = l.naer && bokstavI(k.i, rad);
      if (b && ord.fase === 'fanger' && !b.fanget) { b.fanget = true; b.t = t; }
      else if (b && ord.fase === 'slipper' && b.fanget && !b.borte) { b.borte = true; b.t = t; }
    }
    const x = k.i * f + f / 2;
    for (let j = 0; j < k.spor.length; j++) {
      const s = k.spor[j];
      const b = l.naer && bokstavI(k.i, s.y / f);
      if (b && b.fanget && !b.borte) continue;   // bokstaven står der; regnet går bak den
      if (Math.random() < .015) s.c = tegn();     // tegnene i halen bytter seg av og til, som i Matrix
      const a = (1 - j / k.len) * l.lys;
      if (j === 0 && l.naer) {
        r.shadowColor = k.rod ? 'rgba(186,12,47,.9)' : 'rgba(207,228,246,.95)'; r.shadowBlur = f * .9;
        r.fillStyle = k.rod ? '#ff5a6e' : '#ffffff';
      } else {
        r.shadowBlur = 0;
        r.fillStyle = j === 0 ? `rgba(207,228,246,${l.lys * 1.4})` : j < 3 ? `rgba(207,228,246,${a})` : `rgba(120,170,220,${a * .85})`;
      }
      r.fillText(s.c, x, s.y);
    }
    r.shadowBlur = 0;
    if (k.y - k.len * f > H) k.aktiv = false;
  }
}

// Bokstavene som er fanget. Rett etter fangsten lyser de som et hode og roer seg til isblått-hvitt;
// når de slippes, tones de ut på et halvt sekund mens strømmen fortsetter.
function tegnOrd(t) {
  r.font = `700 ${fs}px ${MONO}`;
  for (const b of ord.bokst) {
    if (!b.fanget) continue;
    const alder = t - b.t, x = b.c * fs + fs / 2, y = ord.rad * fs;
    let a = 1, glod = 0;
    if (b.borte) { a = 1 - alder / 500; if (a <= 0) continue; }
    else glod = Math.max(0, 1 - alder / 1200);
    r.shadowColor = 'rgba(207,228,246,.9)'; r.shadowBlur = fs * (.45 + glod * .8);
    r.fillStyle = `rgba(${235 + 20 * glod | 0},${245 + 10 * glod | 0},255,${a})`;
    r.fillText(b.ch, x, y);
  }
  r.shadowBlur = 0;
}

let sist = performance.now(), ramme = 0;
function steg(t) {
  const dt = Math.min(50, t - sist) / 16.67; sist = t; ramme++;
  if (ramme % 4 === 1 || lett) himmel(t);
  r.clearRect(0, 0, W, H);
  r.textAlign = 'center'; r.textBaseline = 'top';

  regnLag(LAG[0], dt, t);
  // Snøen faller mellom det fjerne og det nære regnet.
  r.fillStyle = 'rgba(238,245,251,.4)';
  for (const f of fnugg) {
    f.y += f.v * dt; f.x += Math.sin(t / 1400 + f.f) * .25 * dt;
    if (f.y > H) { f.y = -4; f.x = Math.random() * W; }
    r.beginPath(); r.arc(f.x, f.y, f.r, 0, 6.283); r.fill();
  }
  if (!ord && t > nesteOrd) nyttOrd(t);
  if (ord) ordSteg(t);
  regnLag(LAG[1], dt, t);
  if (ord) tegnOrd(t);
  requestAnimationFrame(steg);
}

// Maskinene: samme kilde og samme regel som forsiden. Tre minutter uten puls er «Av»; rørt siste 2 min er «I bruk».
async function hent() {
  try {
    const j = await (await fetch('/chat/spor', { cache: 'no-store' })).json();
    for (const k of MASKINER) {
      const m = j.tele?.[k], paa = !!m && j.now - m.ts < 180e3;
      tilstand[k] = !paa ? 'av' : m.ledig != null && m.ledig < 120 ? 'bruk' : 'paa';
    }
  } catch {}
}
hent(); setInterval(() => { if (document.visibilityState === 'visible') hent(); }, 20000);

// Klikk: fullskjerm og hold skjermen våken. Pekeren forsvinner etter tre sekunder i ro.
let vakt = null;
async function vaaken() { try { vakt = await navigator.wakeLock?.request('screen'); } catch {} }
addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen?.();
  vaaken();
});
document.addEventListener('visibilitychange', () => { if (vakt && document.visibilityState === 'visible') vaaken(); });
let ro;
const bevegelse = () => { document.body.classList.remove('stille'); clearTimeout(ro); ro = setTimeout(() => document.body.classList.add('stille'), 3000); };
addEventListener('mousemove', bevegelse); bevegelse();

addEventListener('resize', stoerrelse);
stoerrelse();
// Skjermen er full fra første stund: halvparten av søylene starter midt i et fall.
for (const l of LAG) for (const k of l.kol) if (Math.random() < .5) start(l, k, 0, true);
document.fonts.load('20px Runer', 'ᚠ').finally(() => requestAnimationFrame(steg));
</script>
</body>
</html>
