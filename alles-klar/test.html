<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alles Klar</title>
    <meta name="robots" content="noindex" />
    <!-- Himmelen øverst i vinterbildet, så linjen øverst på telefonen går i ett med bildet (eieren 11.11.2026). -->
    <meta name="theme-color" content="#6593c3" />
    <!--
      Siden på /klart til Klart åpner for alle (LANSERING i .worker/klart.js, 11.11.2026 kl. 23.11).
      Vinterbildet, snø som faller, merket og nedtellingen i det havblå glasskortet fra heroen.
      Innloggingen er skjult (eieren 11.11.2026): klikk på merket, skriv passordet og trykk Enter
      (test.js). Riktig passord gir kapselen som viser de ekte sidene (handleTest i klart.js).
      Passordet er hemmeligheten KLART_TESTPASSORD, ikke noe i repoet.
    -->
    <meta property="og:url" content="https://esbjugconsult.com/alles-klar/" />
    <!-- Delingsbildet (Snapchat, iMessage, Facebook): krystallen på vinterbildet, 1200 × 630.
         Uten det tok Snapchat et tilfeldig bilde fra siden, mappeikonet (eieren 11.11.2026). -->
    <meta property="og:image" content="https://esbjugconsult.com/alles-klar/assets/klart-deling.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Alles Klar: der Silberkristall auf einem Winterbild mit Skispuren" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://esbjugconsult.com/alles-klar/assets/klart-deling.jpg" />
    <link rel="apple-touch-icon" href="/alles-klar/assets/klart-ikon.png" />
    <link rel="icon" type="image/png" href="/alles-klar/favicon.png" />
    <link rel="stylesheet" href="/alles-klar/fonts.css" />
    <link rel="stylesheet" href="/alles-klar/test.css" />
    <script src="/alles-klar/test.js" defer></script>
  </head>
  <body>
    <main class="inngang">
      <img class="bilde" src="/alles-klar/assets/hero-vinter.jpg" width="2400" height="1600" alt="" aria-hidden="true" />
      <div class="himmel" aria-hidden="true"></div>
      <canvas class="sno" aria-hidden="true"></canvas>
      <div class="innhold">
        <h1 class="merke" data-merke>
          <img class="ikon" src="/alles-klar/assets/klart-ikon.png" width="256" height="256" alt="" aria-hidden="true" />
          <span>Alles Klar</span>
        </h1>
        <!-- Samme tidspunkt som LANSERING i .worker/klart.js (23.11 norsk tid 11.11.2026). -->
        <div class="kort nedtelling" data-til="2026-11-11T22:11:00Z">
          <p class="nedtelling-tekst">Öffnet heute Abend um 23:11 Uhr</p>
          <div class="nedtelling-ruter" role="timer" aria-live="off">
            <p class="rute"><b data-del="t">--</b><span>Stunden</span></p>
            <p class="skille" aria-hidden="true">:</p>
            <p class="rute"><b data-del="m">--</b><span>Minuten</span></p>
            <p class="skille" aria-hidden="true">:</p>
            <p class="rute"><b data-del="s">--</b><span>Sekunden</span></p>
          </div>
        </div>
      </div>
      <form class="skjult" method="post" action="/alles-klar/test" hidden>
        <input type="hidden" name="passord" />
      </form>
    </main>
  </body>
</html>
