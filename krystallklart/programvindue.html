                <p class="kv-ki-merke">AI-værktøjet får kun koderne. Navn, telefon, adresse og konto bliver på computeren.</p>
              </div>

              <!-- «Før skanningen»: over startskjermen, når mappen er valgt -->
              <div class="kv-slor kv-s-forvalg">
                <div class="kv-modal">
                  <h4>Klientsager</h4>
                  <p class="kv-modal-under">10 filer · docx, eml, jpg, md, pdf, pptx, xlsx</p>
                  <div class="kv-maate">
                    <p class="på"><i></i><span><b>Med scanning</b>Krystallklart læser filerne og markerer det, programmet finder. Bagefter gennemgår du det hele og bestemmer.</span></p>
                    <p><i></i><span><b>Uden scanning</b>Intet er markeret på forhånd. Du klikker på det, der skal maskeres.</span></p>
                  </div>
                  <p class="kv-sammen"><span><small>Scanningen finder og maskerer</small>Navne, CPR-numre, telefon og e-mail, følsomme oplysninger, nummerplader, konti, ansigter og 5 andre</span><em>Skift</em></p>
                  <p class="kv-modal-bunn">
                    <span class="kv-btn hvit stor">Annullér</span>
                    <span class="kv-btn stor" data-kv="skann">Scan <kbd>↵</kbd></span>
                  </p>
                </div>
              </div>

              <!-- «Før kopiene lages»: formen kopiene får -->
              <div class="kv-slor kv-s-kopivalg">
                <div class="kv-modal kv-kopivalg">
                  <h4>Før kopierne laves</h4>
                  <p class="kv-modal-under">10 filer · kopierne lægges i Klientsager-maskeret</p>
                  <div class="kv-maate kv-former" data-kv="former">
                    <p class="på" data-form="kort"><i></i><span><b>Kort kode og kodeliste</b>Let at læse. Kan gendannes med organisationens nøgle.<code>[Person 4814887] + liste</code></span></p>
                    <p data-form="full"><i></i><span><b>Fuld kode i teksten</b>Ingen liste. Kan gendannes, men er svær at læse.</span></p>
                    <p data-form="lapp"><i></i><span><b>Kun etiketter</b>Let at læse, men kan ikke gendannes.</span></p>
                    <p data-form="svart"><i></i><span><b>Sort maskering (PDF)</b>Det, der stod der, er væk for altid.<code class="kv-svartprove"></code></span></p>
                  </div>
                  <p class="kv-modal-bunn">
                    <span class="kv-btn hvit stor">Annullér</span>
                    <span class="kv-btn stor" data-kv="lagnaa">Lav 10 kopier <kbd>↵</kbd></span>
                  </p>
                </div>
              </div>

              <!-- Kopiene er laget -->
              <div class="kv-slor kv-s-ferdig">
                <div class="kv-ferdig">
                  <p class="kv-stor">Færdig.</p>
                  <p>10 kopier er lavet. Originalerne er uændrede. Læs kopierne, før du giver dem videre.</p>
                  <p class="kv-sti"><span>Dokumenter/</span>Klientsager-maskeret/</p>
                  <p class="kv-liten">Kodelisten ligger bagest i hver kopi.</p>
                  <p class="kv-modal-bunn">
                    <span class="kv-btn hvit">Tilbage til mappen</span>
                    <span class="kv-btn">Åbn kopierne</span>
                  </p>
                </div>
              </div>
            </div>
          </div>
          </div>
          <span class="kv-peker" aria-hidden="true"></span>
          <!-- Kapitlene: hopper i avspillingen. Det som spilles nå, er markert. -->
          <ol class="kv-kapitler" data-kv="kapitler" aria-label="Kapitler i visningen">
            <li><button type="button" data-kapittel="0">Maskér en mappe</button></li>
            <li><button type="button" data-kapittel="1">Gennemgang</button></li>
            <li><button type="button" data-kapittel="2">Kopierne</button></li>
            <li><button type="button" data-kapittel="3">Højreklik i Finder</button></li>
            <li><button type="button" data-kapittel="4">Maskér og gendan tekst</button></li>
          </ol>
          <!-- Lesingen spilles av mye raskere enn den går på en vanlig maskin. Det skal stå. -->
          <p class="kv-spol" aria-hidden="true">
            <svg viewBox="0 0 20 12"><path d="M1 1l8 5-8 5zM10 1l8 5-8 5z" /></svg>
            <span>Spolet frem. Hvor lang tid læsningen tager, afhænger af computeren. På en almindelig bærbar tager det længere.</span>
          </p>
          <figcaption class="skjult-tekst">
            Sådan virker Krystallklart. Når du har valgt en mappe, læser Krystallklart filerne, også PDF, e-mails, regneark, PowerPoint og billeder, og markerer navne, CPR-numre, kontaktoplysninger, adresser, kontonumre, følsomme oplysninger, nummerplader og ansigter, der bliver pixeleret. Det, Krystallklart ikke er sikker på, gennemgår du selv og bestemmer: maskér eller lad stå. Kopierne kan få korte koder med kodeliste, fulde koder, kun etiketter eller sort maskering, og originalerne forbliver uændrede. I Finder kan du maskere en mappe med højreklik › Hurtige handlinger › Maskér med Krystallklart. En tekst med koder kan gives til et AI-værktøj, og svaret kan gendannes i Krystallklart, så navnene kommer tilbage, selv om AI-værktøjet aldrig så dem. Læsningen er spolet frem: tiden afhænger af computeren.
          </figcaption>
        </figure>
