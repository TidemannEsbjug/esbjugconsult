          <figcaption class="skjult-tekst">
            Näin Päivänselvä toimii. Kun olet valinnut kansion, Päivänselvä lukee tiedostot, myös PDF:t, sähköpostit, laskentataulukot, PowerPoint-esitykset ja kuvat, ja merkitsee nimet, henkilötunnukset, yhteystiedot, osoitteet, tilinumerot, arkaluonteiset henkilötiedot, rekisteritunnukset ja kasvot, jotka pikselöidään. Sen, mistä Päivänselvä ei ole varma, käyt itse läpi ja päätät: peitä tai jätä. Kopioihin voi tulla lyhyet koodit ja koodiluettelo, täydet koodit, pelkät tunnisteet tai musta peitto, eikä alkuperäisiin kosketa. Finderissa voit peittää kansion oikealla painikkeella › Pikatoiminnot › Peitä Päivänselvällä. Koodeja sisältävän tekstin voit antaa tekoälytyökalulle ja palauttaa vastauksen sitten Päivänselvässä, jolloin nimet palaavat ilman, että tekoäly on nähnyt niitä. Lukeminen on nopeutettu: sen kesto riippuu tietokoneesta.
          </figcaption>
