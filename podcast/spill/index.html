<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Spill</title>
<link rel="modulepreload" href="js/vendor/three.min.js">
<style>
  html,body{margin:0;height:100%;background:#0c0a09;overflow:hidden;overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .dim{position:fixed;inset:0;background:rgba(8,6,5,.42);opacity:0;transition:opacity .9s cubic-bezier(.65,0,.35,1);pointer-events:none}
  body.pause .dim{opacity:1}
  .poeng{position:fixed;left:50%;bottom:28%;translate:-50% 0;margin:0;font:500 clamp(30px,8vmin,72px)/1 ui-monospace,"SF Mono",Menlo,monospace;
    letter-spacing:.06em;color:rgba(244,234,216,.92);text-shadow:0 2px 24px rgba(6,4,3,.7);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;text-align:center}
  .poeng.vis{opacity:1}
  .poeng.pause{font-size:clamp(18px,3vmin,26px);letter-spacing:.14em}
  .poeng.pause small{display:block;margin-top:10px;font-size:.7em;letter-spacing:.2em;opacity:.6}
  .hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);translate:-50% 0;width:max-content;max-width:calc(100% - 32px);
    font:500 12.5px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif;letter-spacing:.04em;color:rgba(244,234,216,.75);text-align:center;
    text-shadow:0 1px 10px rgba(0,0,0,.6);opacity:0;transition:opacity .8s;pointer-events:none}
  .hint.vis{opacity:1}
  .hint .mus{display:none}
  @media (hover:hover) and (pointer:fine){.hint .mus{display:inline}.hint .touch{display:none}}
</style>
</head>
<body class="pause">
<canvas id="world" aria-hidden="true"></canvas>
<div class="dim"></div>
<div class="poeng" id="poeng" aria-live="polite"></div>
<div class="hint" id="hint">
  <span class="touch">Sveip til sidene for å styre · opp for å hoppe, to ganger for vinger · ned for å dykke · trykk for pause</span>
  <span class="mus">A og D eller pilene styrer · mellomrom hopper, to ganger for vinger · S dykker · P pause</span>
</div>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script type="module" src="js/spill.js"></script>
</body>
</html>
