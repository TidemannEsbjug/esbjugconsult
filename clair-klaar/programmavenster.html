          <figcaption class="skjult-tekst">
            Zo werkt Clair &amp; Klaar. U kiest een map, en Clair &amp; Klaar leest de bestanden, ook pdf,
            e-mail, spreadsheets, PowerPoint en afbeeldingen, en markeert namen, rijksregisternummers, contactgegevens,
            adressen, rekeningnummers, gevoelige gegevens, nummerplaten en gezichten, die worden gepixeld.
            Waar Clair &amp; Klaar niet zeker van is, kijkt u zelf na en beslist u: lakken of laten staan.
            De kopieën kunnen korte codes met een codelijst krijgen, volledige codes, alleen labels of
            zwarte lakken, en de originelen blijven onaangeroerd. In Finder lakt u een map met
            rechtsklik › Snelle taken › Lak met Clair &amp; Klaar. Tekst met codes kunt u aan een AI-tool
            geven, en het antwoord wordt in Clair &amp; Klaar hersteld, zodat de namen terugkomen zonder
