          <figcaption class="skjult-tekst">
            Voici comment fonctionne Clair &amp; Klaar. Choisissez un dossier : Clair &amp; Klaar lit les fichiers, y compris les PDF,
            les e-mails, les tableurs, les présentations PowerPoint et les images, et marque les noms, les numéros de registre
            national, les coordonnées, les adresses, les numéros de compte, les données sensibles, les immatriculations et les
            visages, qui sont pixelisés. Là où Clair &amp; Klaar hésite, vous vérifiez vous-même et décidez : masquer ou garder.
            Les copies peuvent recevoir des codes courts avec une liste des codes, des codes complets, de simples intitulés
            ou un masquage noir, et les originaux restent intacts. Dans le Finder, un dossier s’occulte par clic droit ›
            Actions rapides › Occulter avec Clair &amp; Klaar. Un texte avec des codes peut être confié à un outil d’IA, et la
            réponse est restaurée dans Clair &amp; Klaar : les noms reviennent sans que l’IA les ait vus. La lecture est accélérée :
            sa durée varie d’un ordinateur à l’autre.
          </figcaption>
